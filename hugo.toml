baseURL = "https://chenmudu.github.io/"
title = "chenmudu 的博客"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
theme = "PaperMod"

enableEmoji = true
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "你好，我是 chenmudu 👋"
    Content = "欢迎来到我的博客，这里记录我的学习笔记与思考。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/chenmudu"

[menus]
  [[menus.main]]
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menus.main]]
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menus.main]]
    name = "标签"
    url = "/tags/"
    weight = 3
  [[menus.main]]
    name = "搜索"
    url = "/search/"
    weight = 4
  [[menus.main]]
    name = "关于"
    url = "/about/"
    weight = 5
