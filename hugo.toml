baseURL = "https://chenmudu.github.io/"
title = "chenmudu"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
theme = "PaperMod"

enableEmoji = true
enableRobotsTXT = true
buildFuture = true   # 允许预写/晚于当前时刻的内容进入构建（时间轨道的"未来锁定"负责展示层）

[outputs]
  home = ["HTML", "RSS", "JSON", "ALLJSON"]
  section = ["HTML", "RSS"]

[outputFormats.ALLJSON]
  mediaType = "application/json"
  baseName = "all"
  isPlainText = true
  isHTML = false

[params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false
  description = "chenmudu 的个人档案馆：工作、生活、游戏与记忆。"

  [params.label]
    icon = "/logo.svg"
    iconHeight = 26

  [params.homeInfoParams]
    Title = "chenmudu"
    Content = "把一生拆成一条条记忆，封存于此——工作、生活、游戏与思考。给未来的自己，也给未来的你。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/chenmudu"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:chenmudu@gmail.com"

[menus]
  [[menus.main]]
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menus.main]]
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menus.main]]
    name = "标签"
    url = "/tags/"
    weight = 3
  [[menus.main]]
    name = "搜索"
    url = "/search/"
    weight = 4
  [[menus.main]]
    name = "关于"
    url = "/about/"
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
